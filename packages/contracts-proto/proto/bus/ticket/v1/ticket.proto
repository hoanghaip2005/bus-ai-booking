syntax = "proto3";

package bus.ticket.v1;

service TicketService {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc ListBookingTickets(ListBookingTicketsRequest) returns (ListBookingTicketsResponse);
}

message HealthRequest {
  string request_id = 1;
}

message HealthResponse {
  string service = 1;
  string status = 2;
  string version = 3;
  string request_id = 4;
  string checked_at = 5;
  string trace_id = 6;
}

enum TicketOwnerType {
  TICKET_OWNER_TYPE_UNSPECIFIED = 0;
  TICKET_OWNER_TYPE_GUEST_SESSION = 1;
  TICKET_OWNER_TYPE_CUSTOMER = 2;
}

message TicketOwner {
  TicketOwnerType type = 1;
  string id = 2;
}

message ListBookingTicketsRequest {
  string booking_id = 1;
  TicketOwner owner = 2;
  string request_id = 3;
}

message ListBookingTicketsResponse {
  string booking_id = 1;
  bool ready = 2;
  repeated TicketDocument tickets = 3;
  string request_id = 4;
}

message TicketDocument {
  string id = 1;
  string ticket_code = 2;
  string booking_code = 3;
  string passenger_name = 4;
  string seat_id = 5;
  string route_label = 6;
  string pickup_name = 7;
  string dropoff_name = 8;
  string departure_at = 9;
  string vehicle_label = 10;
  string qr_payload = 11;
  string html_content = 12;
  bytes pdf_document = 13;
  string issued_at = 14;
}
