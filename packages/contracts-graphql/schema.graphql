type Mutation {
  holdSeats(input: HoldSeatsInput!): SeatHold!
  releaseSeatHold(input: ReleaseSeatHoldInput!): ReleaseSeatHoldPayload!
  createBooking(input: CreateBookingInput!): Booking!
  simulatePayment(input: SimulatePaymentInput!): PaymentResult!
  cancelBooking(input: CancelBookingInput!): CancellationResult!
  login(input: LoginInput!): AuthSession!
  refreshSession(input: RefreshSessionInput!): AuthSession!
  logout(input: LogoutInput!): LogoutPayload!
  setTripActive(input: SetTripActiveInput!): TripActivationResult!
  transitionTripStatus(input: TransitionTripStatusInput!): TripStatusTransitionResult!
  createTrip(input: CreateTripInput!): CreateTripResult!
  setSeatBlocked(input: SetSeatBlockedInput!): SetSeatBlockedResult!
  saveAdminLocation(input: SaveAdminLocationInput!): SaveCatalogResourceResult!
  saveAdminRoute(input: SaveAdminRouteInput!): SaveCatalogResourceResult!
  saveAdminVehicle(input: SaveAdminVehicleInput!): SaveCatalogResourceResult!
  saveAdminSeatLayout(input: SaveAdminSeatLayoutInput!): SaveCatalogResourceResult!
  updateAdminTrip(input: UpdateAdminTripInput!): SaveCatalogResourceResult!
  setCatalogResourceActive(input: SetCatalogResourceActiveInput!): SaveCatalogResourceResult!
  checkInTicket(input: CheckInTicketInput!): CheckInResult!
  createPassengerProfile(input: PassengerProfileInput!): PassengerProfile!
  updatePassengerProfile(id: ID!, input: PassengerProfileInput!): PassengerProfile!
  deletePassengerProfile(id: ID!): DeletePassengerProfilePayload!
}

