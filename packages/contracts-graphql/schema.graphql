type Query {
  adminRevenueSummary(input: AnalyticsDateRangeInput!): AdminRevenueSummary!
  adminPopularRoutes(input: PopularRoutesInput!): AdminPopularRoutes!
  adminSearchConversion(input: AnalyticsDateRangeInput!): AdminSearchConversion!
