events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;
  keepalive_timeout 65;
  client_max_body_size 1m;
  limit_req_zone $binary_remote_addr zone=mcp_per_ip:10m rate=10r/s;
  limit_conn_zone $binary_remote_addr zone=mcp_connections:10m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream graphql_gateway_pool {
    zone graphql_gateway_pool 64k;
    server host.docker.internal:4000 max_fails=2 fail_timeout=5s;
    server host.docker.internal:4010 max_fails=2 fail_timeout=5s;
  }

  server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /health {
      access_log off;
      default_type application/json;
      return 200 '{"service":"nginx","status":"UP"}';
    }

    location = /gateway-health {
      proxy_pass http://graphql_gateway_pool/health/ready;
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
      proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    location = /catalog-health {
      proxy_pass http://host.docker.internal:3001/health/ready;
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
    }

    location = /seat-inventory-health {
      proxy_pass http://host.docker.internal:3003/health/ready;
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
    }

    location = /booking-health {
      proxy_pass http://host.docker.internal:3004/health/ready;
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
    }

    location = /payment-health {
      proxy_pass http://host.docker.internal:3005/health/ready;
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
    }

    location = /ticket-health {
      proxy_pass http://host.docker.internal:3006/health/ready;
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
    }

    location = /notification-health {
      proxy_pass http://host.docker.internal:3007/health/ready;
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
    }

    location = /identity-health {
      proxy_pass http://host.docker.internal:3008/health/ready;
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
    }

    location = /analytics-health {
      proxy_pass http://host.docker.internal:3009/health;
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
    }

    location = /mcp-health {
      proxy_pass http://host.docker.internal:3002/health/ready;
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
    }

    location /graphql {
      proxy_pass http://graphql_gateway_pool;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_read_timeout 65s;
      add_header X-Load-Balancer nginx-round-robin always;
    }

    location /mcp {
      client_max_body_size 256k;
      limit_req zone=mcp_per_ip burst=20 nodelay;
      limit_conn mcp_connections 20;
      proxy_pass http://host.docker.internal:3002;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      proxy_connect_timeout 3s;
      proxy_send_timeout 10s;
      proxy_buffering off;
      proxy_read_timeout 65s;
      proxy_hide_header X-Powered-By;
    }

    location / {
      proxy_pass http://host.docker.internal:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
